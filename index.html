<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#f0eeff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Paměť" />
<title>Paměť</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --a-violet:#6c5ce7;--a-teal:#00b894;--a-blue:#0984e3;
  --s-red:#ff6b6b;--s-amber:#feca57;--s-green:#1dd1a1;
  --t-primary:#1a1a2e;--t-secondary:#4a4a6a;--t-muted:#9898b8;
  --glass-bg:rgba(255,255,255,0.65);--glass-border:rgba(255,255,255,0.85);
  --glass-shadow:0 8px 32px rgba(108,92,231,0.10),0 2px 8px rgba(0,0,0,0.06);
  --glass-shadow-sm:0 4px 16px rgba(108,92,231,0.08),0 1px 4px rgba(0,0,0,0.04);
  --r:18px;--r-sm:12px;
}
body{background:linear-gradient(135deg,#f0eeff 0%,#e8f5ff 35%,#fff0f8 70%,#eefff8 100%);background-attachment:fixed;color:var(--t-primary);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;top:-20%;left:-10%;width:60vw;height:60vw;background:radial-gradient(circle,rgba(108,92,231,0.12) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-10%;right:-10%;width:50vw;height:50vw;background:radial-gradient(circle,rgba(0,184,148,0.10) 0%,transparent 70%);pointer-events:none;z-index:0}
/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--glass-border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;font-size:9px;font-weight:500;color:var(--t-muted);border:none;background:none;cursor:pointer;transition:color .2s;font-family:inherit}
.nav-btn.active{color:var(--a-violet)}
.nav-btn svg{width:20px;height:20px}
/* HEADER */
.header{padding:52px 20px 14px;background:rgba(255,255,255,0.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(255,255,255,0.75)}
.header h1{font-size:24px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(120deg,var(--a-violet),var(--a-blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-sub{font-size:13px;color:var(--t-secondary);margin-top:2px}
/* SCREENS */
.screen{display:none;padding:16px 16px 100px;position:relative;z-index:1}
.screen.active{display:block}
/* SEARCH */
.search-bar{display:flex;align-items:center;gap:10px;background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--r);padding:11px 16px;margin-bottom:14px;box-shadow:var(--glass-shadow-sm)}
.search-bar svg{width:18px;height:18px;stroke:var(--t-muted);flex-shrink:0;fill:none}
.search-bar input{background:none;border:none;outline:none;color:var(--t-primary);font-size:15px;flex:1;font-family:inherit}
.search-bar input::placeholder{color:var(--t-muted)}
/* FILTERS */
.filter-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filter-scroll::-webkit-scrollbar{display:none}
.fc{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;background:rgba(255,255,255,0.55);border:1px solid var(--glass-border);color:var(--t-secondary);cursor:pointer;white-space:nowrap;transition:all .2s;font-family:inherit}
.fc.active{background:var(--a-violet);color:white;border-color:var(--a-violet);box-shadow:0 4px 12px rgba(108,92,231,0.30)}
/* CARDS */
.card{background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:transform .18s;box-shadow:var(--glass-shadow)}
.card:active{transform:scale(0.98)}
.card-row{display:flex;align-items:flex-start;gap:12px}
.card-thumb{width:52px;height:52px;border-radius:var(--r-sm);background:linear-gradient(135deg,#eae6ff,#dceefb);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:20px;border:1px solid rgba(255,255,255,0.9)}
.card-thumb img{width:100%;height:100%;object-fit:cover}
.card-body{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:12px;color:var(--t-muted);margin-top:3px}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;background:rgba(108,92,231,0.08);color:var(--a-violet);border:1px solid rgba(108,92,231,0.15)}
.tag.loc{background:rgba(0,184,148,0.10);color:var(--a-teal);border-color:rgba(0,184,148,0.20)}
/* WARRANTY */
.wb{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.wb-ok{background:rgba(29,209,161,0.12);color:#00a381}
.wb-warn{background:rgba(254,202,87,0.18);color:#c9900a}
.wb-exp{background:rgba(255,107,107,0.12);color:#c0392b}
.wbar{height:4px;border-radius:2px;background:rgba(0,0,0,0.07);margin-top:8px;overflow:hidden}
.wbar-fill{height:100%;border-radius:2px;transition:width .4s}
/* FAB */
.fab{position:fixed;bottom:80px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--a-violet),#a29bfe);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(108,92,231,0.40);z-index:90;transition:transform .15s}
.fab:active{transform:scale(0.91)}
.fab svg{width:24px;height:24px;stroke:white;stroke-width:2.2;fill:none}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(26,26,46,0.30);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;display:none;align-items:flex-end}
.modal-bg.open{display:flex}
.modal{background:rgba(255,255,255,0.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:var(--r) var(--r) 0 0;border:1px solid var(--glass-border);border-bottom:none;padding:20px 20px 32px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(108,92,231,0.12)}
.modal-handle{width:36px;height:4px;background:rgba(0,0,0,0.10);border-radius:2px;margin:0 auto 20px}
.modal h2{font-size:20px;font-weight:700;margin-bottom:18px;color:var(--t-primary)}
/* FORM */
.field{margin-bottom:14px}
.field label{font-size:11px;color:var(--t-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.6px;display:block;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,0.75);border:1.5px solid rgba(108,92,231,0.15);border-radius:var(--r-sm);padding:12px 14px;color:var(--t-primary);font-size:15px;font-family:inherit;outline:none;transition:border-color .2s;-webkit-appearance:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--a-violet);box-shadow:0 0 0 3px rgba(108,92,231,0.12)}
.field textarea{resize:none;height:76px}
.field select option{background:white}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* BUTTONS */
.btn-row{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:14px;border-radius:var(--r-sm);font-size:15px;font-weight:600;border:none;cursor:pointer;transition:transform .15s;font-family:inherit}
.btn:active{transform:scale(0.97)}
.btn-primary{background:linear-gradient(135deg,var(--a-violet),#a29bfe);color:white;box-shadow:0 4px 16px rgba(108,92,231,0.30)}
.btn-secondary{background:rgba(108,92,231,0.08);color:var(--a-violet);border:1.5px solid rgba(108,92,231,0.15)}
.btn-danger{background:rgba(255,107,107,0.10);color:#c0392b;border:1.5px solid rgba(255,107,107,0.20)}
/* PHOTO */
.photo-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.photo-thumb{aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;position:relative;background:linear-gradient(135deg,#eae6ff,#dceefb);border:1px solid rgba(255,255,255,0.9)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(255,107,107,0.85);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;color:white;font-weight:700}
.photo-add{aspect-ratio:1;border-radius:var(--r-sm);background:linear-gradient(135deg,#eae6ff,#dceefb);border:2px dashed rgba(108,92,231,0.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative}
.photo-add input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-add svg{width:22px;height:22px;stroke:var(--a-violet);opacity:0.7;fill:none}
.photo-add span{font-size:11px;color:var(--a-violet);font-weight:500}
.photo-full{width:100%;height:200px;object-fit:cover;border-radius:var(--r-sm);margin-bottom:6px;cursor:pointer}
/* WARRANTY FORM SECTION */
.wsec{background:linear-gradient(135deg,rgba(108,92,231,0.06),rgba(0,184,148,0.06));border:1.5px solid rgba(108,92,231,0.15);border-radius:var(--r-sm);padding:14px;margin-bottom:14px}
.wsec-title{font-size:12px;color:var(--a-violet);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px}
.wprev{font-size:12px;color:var(--a-teal);font-weight:500;margin-top:6px}
/* TRAFFIC LIGHT */
.trow{display:flex;align-items:center;gap:14px;margin-top:6px}
.light{width:32px;height:32px;border-radius:50%;opacity:0.28;cursor:pointer;transition:opacity .2s,transform .2s}
.light.active{opacity:1;transform:scale(1.12)}
.light.red{background:var(--s-red)}.light.amber{background:var(--s-amber)}.light.green{background:var(--s-green)}
.light.red.active{box-shadow:0 0 0 4px rgba(255,107,107,0.22)}
.light.amber.active{box-shadow:0 0 0 4px rgba(254,202,87,0.28)}
.light.green.active{box-shadow:0 0 0 4px rgba(29,209,161,0.22)}
.light-lbl{font-size:13px;color:var(--t-secondary);margin-left:6px;font-weight:500}
/* CATEGORY PILLS */
.cpill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.cat-kuchyn{background:rgba(253,203,110,0.18);color:#b8720a}
.cat-drogerie{background:rgba(0,184,148,0.12);color:#007a61}
.cat-zahrada{background:rgba(85,239,196,0.18);color:#00816e}
.cat-domacnost{background:rgba(225,112,85,0.12);color:#b5421a}
.cat-pet{background:rgba(253,121,168,0.12);color:#c2185b}
.cat-ostatni{background:rgba(108,92,231,0.12);color:var(--a-violet)}
/* DETAIL */
.dsec{margin-bottom:16px}
.dsec h3{font-size:11px;color:var(--t-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px}
.dval{font-size:15px;color:var(--t-primary)}
.dphoto{width:100%;max-height:230px;object-fit:cover;border-radius:var(--r);margin-bottom:16px}
/* PROFILE */
.profile-avatar{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--a-violet),var(--a-teal));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:white;margin:0 auto 14px;box-shadow:0 6px 20px rgba(108,92,231,0.30)}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat-card{background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--r-sm);padding:14px;text-align:center;box-shadow:var(--glass-shadow-sm)}
.stat-num{font-size:26px;font-weight:700;background:linear-gradient(120deg,var(--a-violet),var(--a-blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:12px;color:var(--t-muted);margin-top:2px;font-weight:500}
.pcard{display:flex;align-items:center;gap:12px;background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:transform .15s;box-shadow:var(--glass-shadow-sm);width:100%;font-family:inherit;text-align:left;border:1px solid var(--glass-border)}
.pcard:active{transform:scale(0.98)}
.pcard-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.pcard strong{display:block;font-size:15px;font-weight:600;color:var(--t-primary)}
.pcard span{font-size:12px;color:var(--t-muted)}
/* NOTIFICATIONS */
.notif-banner{background:rgba(254,202,87,0.14);border:1.5px solid rgba(254,202,87,0.38);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.notif-banner svg{width:18px;height:18px;stroke:#c9900a;flex-shrink:0;margin-top:1px;fill:none}
.notif-banner p{font-size:13px;color:#7a5800;line-height:1.5}
.push-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.push-dot.on{background:var(--s-green);box-shadow:0 0 0 3px rgba(29,209,161,0.20)}
.push-dot.off{background:var(--t-muted)}
/* SECTION HEAD */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-head h2{font-size:11px;font-weight:700;color:var(--t-muted);text-transform:uppercase;letter-spacing:0.6px}
/* LOGIN */
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;position:relative;z-index:1}
.login-logo{font-size:56px;margin-bottom:10px}
.login-title{font-size:34px;font-weight:700;letter-spacing:-1px;margin-bottom:6px;background:linear-gradient(120deg,var(--a-violet),var(--a-blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-sub{font-size:15px;color:var(--t-secondary);margin-bottom:36px;text-align:center;line-height:1.5}
.login-form{width:100%;max-width:360px;background:var(--glass-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--r);padding:24px 24px 20px;box-shadow:var(--glass-shadow)}
/* IMPORT */
.import-area{border:2px dashed rgba(108,92,231,0.25);border-radius:var(--r-sm);padding:20px;text-align:center;cursor:pointer;position:relative;margin-top:8px;background:rgba(108,92,231,0.04)}
.import-area input{position:absolute;inset:0;opacity:0;cursor:pointer}
.import-area p{font-size:14px;color:var(--t-muted)}
/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);background:linear-gradient(135deg,var(--a-violet),#a29bfe);color:white;padding:11px 24px;border-radius:24px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(108,92,231,0.35);font-family:inherit}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--t-muted);font-size:15px;line-height:1.6}
/* CALENDAR */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-title{font-size:18px;font-weight:700;color:var(--t-primary);letter-spacing:-0.3px}
.cal-nav{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:10px;width:36px;height:36px;font-size:22px;color:var(--a-violet);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.cal-nav:active{transform:scale(0.93)}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.cal-leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t-muted);font-weight:500}
.cal-leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--t-muted);padding:4px 0 8px;text-transform:uppercase}
.cal-cell{aspect-ratio:1;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;padding:2px}
.cal-cell:active{transform:scale(0.93)}
.cal-empty{aspect-ratio:1;background:transparent;border:none}
.cal-cell-warn{background:rgba(254,202,87,0.15);border-color:rgba(254,202,87,0.35)}
.cal-cell-exp{background:rgba(255,107,107,0.12);border-color:rgba(255,107,107,0.30)}
.cal-num{font-size:11px;font-weight:600;color:var(--t-primary);line-height:1}
.cal-today{background:var(--a-violet);color:white;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.cal-dots{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap;justify-content:center}
.cal-dot{width:4px;height:4px;border-radius:50%}
.cal-ev-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.cal-ev-date{font-size:12px;font-weight:700;color:var(--t-muted);text-transform:uppercase;letter-spacing:0.4px;margin-top:12px;margin-bottom:2px}
.cal-ev-item{display:flex;align-items:center;gap:10px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--glass-shadow-sm)}
.cal-ev-item:active{transform:scale(0.98)}
.cal-ev-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cal-ev-name{font-size:13px;font-weight:600;color:var(--t-primary)}
.cal-ev-type{font-size:11px;color:var(--t-muted);margin-top:1px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-logo">🧠</div>
  <h1 class="login-title">Paměť</h1>
  <p class="login-sub">Váš osobní asistent pro domácnost</p>
  <div class="login-form">
    <div class="field"><label>Jméno</label><input type="text" id="loginName" placeholder="Jak vám mám říkat?" /></div>
    <div class="field"><label>E-mail</label><input type="email" id="loginEmail" placeholder="vas@email.cz" /></div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" id="loginBtn">Začít používat →</button>
  </div>
</div>

<!-- APP -->
<div id="appScreen" style="display:none">
  <div class="header">
    <h1 id="headerTitle">Účtenky</h1>
    <div class="header-sub" id="headerSub"></div>
  </div>

  <!-- ÚČTENKY -->
  <div class="screen active" id="screen-receipts">
    <div id="expiryBanner"></div>
    <div class="search-bar">
      <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="receiptSearch" placeholder="Klíčové slovo nebo místo..." oninput="renderReceipts()" />
    </div>
    <div class="filter-scroll" id="receiptFilters"></div>
    <div id="receiptList"></div>
    <button class="fab" id="fabReceipt">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- POLOŽKY -->
  <div class="screen" id="screen-items">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="itemSearch" placeholder="Hledat produkt..." oninput="renderItems()" />
    </div>
    <div class="filter-scroll" id="itemFilters"></div>
    <div id="itemList"></div>
    <button class="fab" id="fabItem">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- KALENDÁŘ -->

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
<script>
'use strict';

// ── CONSTANTS ──────────────────────────────────────────────
const CATS = {
  kuchyn:'🍳 Kuchyň', drogerie:'🧴 Drogerie', zahrada:'🌿 Zahrada',
  domacnost:'🏠 Domácnost', pet:'🐾 Pet', ostatni:'📦 Ostatní'
};
const LIGHTS = {
  red:{label:'Nekupovat',color:'var(--s-red)'},
  amber:{label:'Výjimečně',color:'var(--s-amber)'},
  green:{label:'Super produkt',color:'var(--s-green)'}
};
const MONTHS = ['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
const DAYS = ['Po','Út','St','Čt','Pá','So','Ne'];
const TAB_TITLES = {receipts:'Účtenky',items:'Položky',calendar:'Kalendář',zaruka:'Záruky',profile:'Profil'};

// ── STATE ──────────────────────────────────────────────────
let user = null, receipts = [], items = [], pushEnabled = false;
let activeRF = '', activeIF = '';
let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();

// ── HELPERS ────────────────────────────────────────────────
function toast(msg, dur) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur || 2400);
}
function openModal(id) { document.getElementById('modal-'+id).classList.add('open'); }
function closeModal(id) { document.getElementById('modal-'+id).classList.remove('open'); }
function storageKey(name) { return name + '_' + (user ? user.email : 'anon'); }

async function saveReceipts() { await localforage.setItem(storageKey('receipts'), receipts); }
async function saveItems()    { await localforage.setItem(storageKey('items'), items); }

// ── WARRANTY ───────────────────────────────────────────────
function wExpiry(r) {
  if (!r.purchaseDate || !r.wLen) return null;
  const d = new Date(r.purchaseDate);
  if (r.wUnit === 'years') d.setFullYear(d.getFullYear() + parseInt(r.wLen));
  else d.setMonth(d.getMonth() + parseInt(r.wLen));
  return d;
}
function wDaysLeft(r) {
  const exp = wExpiry(r); if (!exp) return null;
  return Math.ceil((exp - new Date()) / 86400000);
}
function wPercent(r) {
  const exp = wExpiry(r); if (!exp || !r.purchaseDate) return 0;
  const start = new Date(r.purchaseDate);
  return Math.min(100, Math.max(0, Math.round((new Date()-start)/(exp-start)*100)));
}
function wBadge(r) {
  const d = wDaysLeft(r); if (d === null) return '';
  if (d < 0)   return '<span class="wb wb-exp">⚠ Vypršela</span>';
  if (d <= 30) return '<span class="wb wb-warn">⏰ ' + d + ' dní</span>';
  return '<span class="wb wb-ok">🛡 ' + Math.ceil(d/30) + ' měs.</span>';
}
function wFillColor(d) {
  if (d === null) return 'var(--t-muted)';
  if (d < 0) return 'var(--s-red)';
  if (d <= 30) return 'var(--s-amber)';
  return 'var(--s-green)';
}

// ── TABS ───────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('headerTitle').textContent = TAB_TITLES[tab];
  if (tab === 'profile')  renderProfile();
  if (tab === 'zaruka')   renderZaruky();
  if (tab === 'calendar') renderCalendar();
}

// ── LOGIN ──────────────────────────────────────────────────
document.getElementById('loginBtn').addEventListener('click', async function() {
  const name  = document.getElementById('loginName').value.trim();
  const email = document.getElementById('loginEmail').value.trim();
  if (!name)  { toast('Zadej jméno'); return; }
  if (!email || !email.includes('@')) { toast('Zadej platný e-mail'); return; }
  this.textContent = 'Načítám...';
  this.disabled = true;
  try {
    user = { name, email, created: Date.now() };
    await localforage.setItem('user', user);
    await bootApp();
  } catch(e) {
    console.error('Login error:', e);
    toast('Chyba: ' + e.message);
    this.textContent = 'Začít používat →';
    this.disabled = false;
  }
});

async function bootApp() {
  try {
    receipts    = (await localforage.getItem(storageKey('receipts'))) || [];
    items       = (await localforage.getItem(storageKey('items')))    || [];
    pushEnabled = (await localforage.getItem(storageKey('push')))     || false;
  } catch(e) {
    console.warn('Storage load error:', e);
    receipts = []; items = []; pushEnabled = false;
  }
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display   = 'block';
  document.getElementById('headerSub').textContent = 'Ahoj, ' + user.name + '!';
  try { buildReceiptFilters(); } catch(e) { console.warn(e); }
  try { renderReceipts(); }     catch(e) { console.warn(e); document.getElementById('receiptList').innerHTML = '<div class="empty">Chyba načítání — zkus obnovit stránku.</div>'; }
  try { checkExpiryBanner(); }  catch(e) { console.warn(e); }
  try { buildItemFilters(); }   catch(e) { console.warn(e); }
  try { renderItems(); }        catch(e) { console.warn(e); document.getElementById('itemList').innerHTML = '<div class="empty">Chyba načítání.</div>'; }
  if (pushEnabled) try { checkAndNotify(); } catch(e) { console.warn(e); }
}

function logout() {
  if (!confirm('Opravdu se odhlásit?')) return;
  user = null; receipts = []; items = [];
  document.getElementById('appScreen').style.display   = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

// ── NAV BUTTONS ────────────────────────────────────────────
['receipts','items','calendar','zaruka','profile'].forEach(tab => {
  document.getElementById('tab-'+tab).addEventListener('click', () => switchTab(tab));
});

// ── FAB ────────────────────────────────────────────────────
document.getElementById('fabReceipt').addEventListener('click', openAddReceipt);
document.getElementById('fabItem').addEventListener('click', function() {
  document.getElementById('iName').value   = '';
  document.getElementById('iNote').value   = '';
  document.getElementById('editIId').value = '';
  document.querySelector('#modal-item h2').textContent = 'Nová položka';
  currentItemPhotos = [];
  renderItemPhotoGallery();
  setLight('red');
  openModal('item');
});

// ── RECEIPT FILTERS ────────────────────────────────────────
function buildReceiptFilters() {
  const locs = [...new Set(receipts.map(r => r.location).filter(Boolean))];
  const el = document.getElementById('receiptFilters');
  el.innerHTML = '<button class="fc active" onclick="filterR(this,\'\')">Vše</button>' +
    locs.map(l => '<button class="fc" onclick="filterR(this,\'' + l + '\')">' + l + '</button>').join('');
}
function filterR(el, val) {
  activeRF = val;
  document.querySelectorAll('#receiptFilters .fc').forEach(c => c.classList.remove('active'));
  el.classList.add('active'); renderReceipts();
}

// ── RENDER RECEIPTS ────────────────────────────────────────
function renderReceipts() {
  const q = document.getElementById('receiptSearch').value.toLowerCase();
  const list = receipts.filter(r => {
    const m = !q || [r.name,r.keywords,r.location,r.note].join(' ').toLowerCase().includes(q);
    return m && (!activeRF || r.location === activeRF);
  });
  const el = document.getElementById('receiptList');
  if (!list.length) {
    el.innerHTML = '<div class="empty">' + (receipts.length ? 'Žádné výsledky' : 'Zatím žádná účtenka.<br>Klikni + a přidej první.') + '</div>';
    return;
  }
  el.innerHTML = list.map(r => {
    const rPhotos = r.photos && r.photos.length ? r.photos : (r.photo ? [r.photo] : []);
    const thumbHtml = rPhotos.length
      ? '<img src="' + rPhotos[0] + '" alt="foto" />' + (rPhotos.length > 1 ? '<div style="position:absolute;bottom:2px;right:2px;background:rgba(108,92,231,0.85);color:white;font-size:9px;font-weight:700;border-radius:8px;padding:1px 5px">+' + (rPhotos.length-1) + '</div>' : '')
      : '🧾';
    return '<div class="card" onclick="showReceiptDetail(\'' + r.id + '\')">' +
      '<div class="card-row">' +
        '<div class="card-thumb" style="position:relative">' + thumbHtml + '</div>' +
        '<div class="card-body">' +
          '<div class="card-title">' + r.name + '</div>' +
          '<div class="card-meta">' + (r.purchaseDate ? new Date(r.purchaseDate+'T12:00:00').toLocaleDateString('cs-CZ') : 'Datum neuvedeno') + '</div>' +
          '<div class="card-tags">' +
            (r.keywords ? r.keywords.split(',').slice(0,2).map(k => '<span class="tag">' + k.trim() + '</span>').join('') : '') +
            (r.location ? '<span class="tag loc">📍 ' + r.location + '</span>' : '') +
            wBadge(r) +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ── ADD / EDIT RECEIPT ─────────────────────────────────────
function openAddReceipt() {
  document.getElementById('receiptModalTitle').textContent = 'Nová účtenka';
  document.getElementById('editRId').value = '';
  ['rName','rKeywords','rLocation','rNote','photoData','rWLen'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('rDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('rWUnit').value = 'months';
  document.getElementById('wPrev').textContent = '';
  currentPhotos = [];
  renderPhotoGallery();
  openModal('receipt');
}

function clearPhotoBox() {
  currentPhotos = [];
  renderPhotoGallery();
}

// Multi-photo support
let currentPhotos = []; // array of base64 strings

function renderPhotoGallery() {
  const gallery = document.getElementById('photoGallery');
  if (!gallery) return;
  let html = currentPhotos.map((p, i) =>
    '<div class="photo-thumb">' +
      '<img src="' + p + '" alt="foto ' + (i+1) + '" onclick="viewPhoto(' + i + ')" />' +
      '<button class="photo-thumb-del" onclick="removePhoto(' + i + ')">×</button>' +
    '</div>'
  ).join('');
  // Add button (max 6 photos)
  if (currentPhotos.length < 6) {
    html += '<div class="photo-add">' +
      '<input type="file" accept="image/*" onchange="addPhoto(this)" />' +
      '<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>' +
      '<span>' + (currentPhotos.length === 0 ? 'Přidat foto' : '+') + '</span>' +
    '</div>';
  }
  gallery.innerHTML = html;
  document.getElementById('photoData').value = JSON.stringify(currentPhotos);
}

function renderItemPhotoGallery() {
  const gallery = document.getElementById('itemPhotoGallery');
  if (!gallery) return;
  let html = currentItemPhotos.map((p, i) =>
    '<div class="photo-thumb">' +
      '<img src="' + p + '" alt="foto" onclick="viewPhotoUrl(this.src)" />' +
      '<button class="photo-thumb-del" onclick="removeItemPhoto(' + i + ')">×</button>' +
    '</div>'
  ).join('');
  if (currentItemPhotos.length < 6) {
    html += '<div class="photo-add">' +
      '<input type="file" accept="image/*" onchange="addItemPhoto(this)" />' +
      '<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>' +
      '<span>' + (currentItemPhotos.length === 0 ? 'Přidat foto' : '+') + '</span>' +
    '</div>';
  }
  gallery.innerHTML = html;
  document.getElementById('iPhotoData').value = JSON.stringify(currentItemPhotos);
}

function addItemPhoto(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { currentItemPhotos.push(e.target.result); renderItemPhotoGallery(); };
  reader.readAsDataURL(file);
}

function removeItemPhoto(idx) {
  currentItemPhotos.splice(idx, 1);
  renderItemPhotoGallery();
}

function addPhoto(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    currentPhotos.push(e.target.result);
    renderPhotoGallery();
  };
  reader.readAsDataURL(file);
}

function removePhoto(idx) {
  currentPhotos.splice(idx, 1);
  renderPhotoGallery();
}

function viewPhoto(idx) {
  viewPhotoUrl(currentPhotos[idx]);
}

function viewPhotoUrl(src) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;display:flex;align-items:center;justify-content:center';
  overlay.onclick = () => overlay.remove();
  const img = document.createElement('img');
  img.src = src;
  img.style.cssText = 'max-width:95vw;max-height:90vh;border-radius:12px;object-fit:contain';
  overlay.appendChild(img);
  document.body.appendChild(overlay);
}

function updateWPreview() {
  const len  = document.getElementById('rWLen').value;
  const unit = document.getElementById('rWUnit').value;
  const date = document.getElementById('rDate').value;
  const el   = document.getElementById('wPrev');
  if (!len || !date) { el.textContent = ''; return; }
  const d = new Date(date+'T12:00:00');
  if (unit === 'years') d.setFullYear(d.getFullYear() + parseInt(len));
  else d.setMonth(d.getMonth() + parseInt(len));
  el.textContent = 'Vyprší: ' + d.toLocaleDateString('cs-CZ');
}
document.getElementById('rWLen').addEventListener('input', updateWPreview);
document.getElementById('rWUnit').addEventListener('change', updateWPreview);
document.getElementById('rDate').addEventListener('change', updateWPreview);

document.getElementById('cancelReceipt').addEventListener('click', () => closeModal('receipt'));
document.getElementById('saveReceipt').addEventListener('click', async function() {
  const name = document.getElementById('rName').value.trim();
  if (!name) { toast('Zadej název'); return; }
  const editId = document.getElementById('editRId').value;
  const r = {
    id: editId || Date.now().toString(), name,
    photo: currentPhotos[0] || '',
    photos: [...currentPhotos],
    keywords: document.getElementById('rKeywords').value,
    location: document.getElementById('rLocation').value,
    purchaseDate: document.getElementById('rDate').value,
    wLen: document.getElementById('rWLen').value,
    wUnit: document.getElementById('rWUnit').value,
    note: document.getElementById('rNote').value,
    created: Date.now()
  };
  if (editId) receipts = receipts.map(x => x.id === editId ? r : x);
  else receipts.unshift(r);
  await saveReceipts();
  closeModal('receipt');
  toast('Uloženo!');
  buildReceiptFilters(); renderReceipts(); renderZaruky(); checkExpiryBanner();
});

// ── RECEIPT DETAIL ─────────────────────────────────────────
function showReceiptDetail(id) {
  const r = receipts.find(x => x.id === id); if (!r) return;
  const d = wDaysLeft(r), pct = wPercent(r), fc = wFillColor(d);
  const photos = r.photos && r.photos.length ? r.photos : (r.photo ? [r.photo] : []);
  const photosHtml = photos.length ?
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px">' +
    photos.map((p,i) => '<img src="' + p + '" style="height:100px;width:100%;border-radius:10px;object-fit:cover;cursor:pointer" onclick="viewPhotoUrl(this.src)" alt="foto" />').join('') +
    '</div>' : '';
  document.getElementById('rDetailContent').innerHTML =
    photosHtml +
    '<h2 style="font-size:20px;font-weight:700;margin-bottom:16px">' + r.name + '</h2>' +
    (r.purchaseDate ? '<div class="dsec"><h3>Datum nákupu</h3><div class="dval">' + new Date(r.purchaseDate+'T12:00:00').toLocaleDateString('cs-CZ') + '</div></div>' : '') +
    (r.wLen ? '<div class="dsec"><h3>Záruka</h3>' + wBadge(r) +
      (wExpiry(r) ? '<div style="margin-top:8px;font-size:13px;color:var(--t-muted)">Vyprší: ' + wExpiry(r).toLocaleDateString('cs-CZ') + '</div>' : '') +
      '<div class="wbar"><div class="wbar-fill" style="width:' + pct + '%;background:' + fc + '"></div></div></div>' : '') +
    (r.keywords ? '<div class="dsec"><h3>Klíčová slova</h3><div class="card-tags">' + r.keywords.split(',').map(k => '<span class="tag">' + k.trim() + '</span>').join('') + '</div></div>' : '') +
    (r.location ? '<div class="dsec"><h3>Místo uložení</h3><div class="dval" style="color:var(--a-teal)">📍 ' + r.location + '</div></div>' : '') +
    (r.note ? '<div class="dsec"><h3>Poznámka</h3><div class="dval" style="color:var(--t-muted)">' + r.note + '</div></div>' : '');
  document.getElementById('rDetailBtns').innerHTML =
    '<button class="btn btn-danger" onclick="deleteReceipt(\'' + id + '\')">Smazat</button>' +
    '<button class="btn btn-secondary" onclick="editReceipt(\'' + id + '\');closeModal(\'rdetail\')">Upravit</button>' +
    '<button class="btn btn-secondary" onclick="closeModal(\'rdetail\')">Zavřít</button>';
  openModal('rdetail');
}

function editReceipt(id) {
  const r = receipts.find(x => x.id === id); if (!r) return;
  document.getElementById('receiptModalTitle').textContent = 'Upravit účtenku';
  document.getElementById('editRId').value     = id;
  document.getElementById('rName').value       = r.name        || '';
  document.getElementById('rKeywords').value   = r.keywords    || '';
  document.getElementById('rLocation').value   = r.location    || '';
  document.getElementById('rDate').value       = r.purchaseDate|| '';
  document.getElementById('rWLen').value       = r.wLen        || '';
  document.getElementById('rWUnit').value      = r.wUnit       || 'months';
  document.getElementById('rNote').value       = r.note        || '';
  currentPhotos = r.photos ? [...r.photos] : (r.photo ? [r.photo] : []);
  renderPhotoGallery();
  updateWPreview();
  openModal('receipt');
}

async function deleteReceipt(id) {
  receipts = receipts.filter(r => r.id !== id);
  await saveReceipts();
  closeModal('rdetail');
  buildReceiptFilters(); renderReceipts(); renderZaruky(); checkExpiryBanner();
  toast('Smazáno');
}

function checkExpiryBanner() {
  const exp = receipts.filter(r => { const d = wDaysLeft(r); return d !== null && d >= 0 && d <= 30; });
  const el = document.getElementById('expiryBanner');
  if (!exp.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="notif-banner"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><p><strong>' + exp.length + ' záruční lhůta vyprší do 30 dní.</strong> Zkontroluj záložku Záruky.</p></div>';
}

// ── ZÁRUKY TAB ─────────────────────────────────────────────
function renderZaruky() {
  const withW = receipts.filter(r => r.wLen && r.purchaseDate).sort((a,b) => (wDaysLeft(a)??99999)-(wDaysLeft(b)??99999));
  const el = document.getElementById('zarukaList');
  if (!withW.length) { el.innerHTML = '<div class="empty">Zatím žádná záruční lhůta.<br>Přidej ji při ukládání účtenky.</div>'; return; }
  const expired  = withW.filter(r => (wDaysLeft(r)??1) < 0);
  const expiring = withW.filter(r => { const d=wDaysLeft(r); return d!==null&&d>=0&&d<=30; });
  const ok       = withW.filter(r => { const d=wDaysLeft(r); return d!==null&&d>30; });
  let html = '';
  if (expiring.length) html += '<div class="sec-head"><h2>⏰ Vyprší brzy</h2></div>' + expiring.map(zarukaCard).join('');
  if (ok.length)       html += '<div class="sec-head" style="margin-top:16px"><h2>🛡 Aktivní</h2></div>' + ok.map(zarukaCard).join('');
  if (expired.length)  html += '<div class="sec-head" style="margin-top:16px"><h2>❌ Vypršelé</h2></div>' + expired.map(zarukaCard).join('');
  el.innerHTML = html;
  document.getElementById('tab-zaruka').style.color = expiring.length ? 'var(--s-amber)' : '';
}
function zarukaCard(r) {
  const d = wDaysLeft(r), pct = wPercent(r), fc = wFillColor(d);
  return '<div class="card" onclick="showReceiptDetail(\'' + r.id + '\')">' +
    '<div class="card-row">' +
      '<div class="card-thumb">' + (r.photo ? '<img src="' + r.photo + '" alt="foto" />' : '🧾') + '</div>' +
      '<div class="card-body">' +
        '<div class="card-title">' + r.name + '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;margin-top:4px">' + wBadge(r) +
          (wExpiry(r) ? '<span style="font-size:12px;color:var(--t-muted)">do ' + wExpiry(r).toLocaleDateString('cs-CZ') + '</span>' : '') +
        '</div>' +
        '<div class="wbar"><div class="wbar-fill" style="width:' + pct + '%;background:' + fc + '"></div></div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// ── ITEM FILTERS ────────────────────────────────────────────
function buildItemFilters() {
  document.getElementById('itemFilters').innerHTML =
    '<button class="fc active" onclick="filterI(this,\'\')">Vše</button>' +
    Object.entries(CATS).map(([k,v]) => '<button class="fc" onclick="filterI(this,\'' + k + '\')">' + v + '</button>').join('');
}
function filterI(el, val) {
  activeIF = val;
  document.querySelectorAll('#itemFilters .fc').forEach(c => c.classList.remove('active'));
  el.classList.add('active'); renderItems();
}

// ── TRAFFIC LIGHT ───────────────────────────────────────────
function setLight(val) {
  document.getElementById('iLight').value = val;
  ['red','amber','green'].forEach(c => document.getElementById('l-'+c).classList.toggle('active', c===val));
  document.getElementById('lightLbl').textContent = LIGHTS[val].label;
  document.getElementById('lightLbl').style.color = LIGHTS[val].color;
}
document.getElementById('l-red').addEventListener('click',   () => setLight('red'));
document.getElementById('l-amber').addEventListener('click', () => setLight('amber'));
document.getElementById('l-green').addEventListener('click', () => setLight('green'));

// ── RENDER ITEMS ────────────────────────────────────────────
function renderItems() {
  const q = document.getElementById('itemSearch').value.toLowerCase();
  const list = items.filter(i => {
    const m = !q || [i.name,i.note,i.cat].join(' ').toLowerCase().includes(q);
    return m && (!activeIF || i.cat === activeIF);
  });
  const el = document.getElementById('itemList');
  if (!list.length) { el.innerHTML = '<div class="empty">' + (items.length ? 'Žádné výsledky' : 'Zatím žádná položka.<br>Klikni + a přidej první.') + '</div>'; return; }
  el.innerHTML = list.map(i =>
    '<div class="card" onclick="showItemDetail(\'' + i.id + '\')">' +
      '<div class="card-row">' +
        '<div style="width:6px;border-radius:3px;background:' + (LIGHTS[i.light]?.color||'var(--t-muted)') + ';align-self:stretch;flex-shrink:0"></div>' +
        '<div class="card-body" style="margin-left:12px">' +
          '<div class="card-title">' + i.name + '</div>' +
          '<div style="display:flex;align-items:center;gap:8px;margin-top:5px">' +
            '<span class="cpill cat-' + i.cat + '">' + CATS[i.cat] + '</span>' +
            '<span style="font-size:12px;color:' + LIGHTS[i.light]?.color + '">' + LIGHTS[i.light]?.label + '</span>' +
          '</div>' +
          (i.note ? '<div style="font-size:12px;color:var(--t-muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + i.note + '</div>' : '') +
        '</div>' +
      '</div>' +
    '</div>'
  ).join('');
}

document.getElementById('cancelItem').addEventListener('click', () => closeModal('item'));
document.getElementById('saveItem').addEventListener('click', async function() {
  const name = document.getElementById('iName').value.trim();
  if (!name) { toast('Zadej název'); return; }
  const editId = document.getElementById('editIId').value;
  const item = {
    id: editId || Date.now().toString(),
    name,
    cat:    document.getElementById('iCat').value,
    light:  document.getElementById('iLight').value,
    note:   document.getElementById('iNote').value,
    photo:  currentItemPhotos[0] || '',
    photos: [...currentItemPhotos],
    created: editId ? (items.find(x=>x.id===editId)?.created || Date.now()) : Date.now()
  };
  if (editId) {
    items = items.map(x => x.id === editId ? item : x);
  } else {
    items.unshift(item);
  }
  document.getElementById('editIId').value = '';
  await saveItems();
  closeModal('item'); toast('Uloženo!'); renderItems(); renderProfile();
});

let currentItemId = null;
let currentItemPhotos = [];

function showItemDetail(id) {
  const i = items.find(x => x.id === id); if (!i) return;
  currentItemId = id;
  const iPhotos = i.photos && i.photos.length ? i.photos : (i.photo ? [i.photo] : []);
  const iPhotosHtml = iPhotos.length
    ? '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px">' +
      iPhotos.map(p => '<img src="' + p + '" style="height:100px;width:100%;border-radius:10px;object-fit:cover;cursor:pointer" onclick="viewPhotoUrl(this.src)" alt="foto" />').join('') +
      '</div>' : '';
  document.getElementById('iDetailContent').innerHTML =
    iPhotosHtml +
    '<h2 style="font-size:20px;font-weight:700;margin-bottom:16px">' + i.name + '</h2>' +
    '<div class="dsec"><h3>Kategorie</h3><span class="cpill cat-' + i.cat + '">' + CATS[i.cat] + '</span></div>' +
    '<div class="dsec"><h3>Hodnocení</h3><div style="display:flex;align-items:center;gap:10px"><div style="width:14px;height:14px;border-radius:50%;background:' + LIGHTS[i.light]?.color + '"></div><span style="font-size:16px;font-weight:600;color:' + LIGHTS[i.light]?.color + '">' + LIGHTS[i.light]?.label + '</span></div></div>' +
    (i.note ? '<div class="dsec"><h3>Poznámka</h3><div class="dval" style="color:var(--t-muted)">' + i.note + '</div></div>' : '');
  openModal('idetail');
}

async function deleteCurrentItem() {
  if (!currentItemId) return;
  items = items.filter(x => x.id !== currentItemId);
  await saveItems(); closeModal('idetail'); renderItems(); renderProfile(); toast('Smazáno');
  currentItemId = null;
}

function editCurrentItem() {
  if (!currentItemId) return;
  closeModal('idetail');
  editItem(currentItemId);
}

function editItem(id) {
  const i = items.find(x => x.id === id); if (!i) return;
  document.getElementById('iName').value   = i.name || '';
  document.getElementById('iCat').value    = i.cat  || 'kuchyn';
  document.getElementById('iNote').value   = i.note || '';
  document.getElementById('editIId').value = id;
  document.querySelector('#modal-item h2').textContent = 'Upravit položku';
  currentItemPhotos = i.photos && i.photos.length ? [...i.photos] : (i.photo ? [i.photo] : []);
  renderItemPhotoGallery();
  setLight(i.light || 'red');
  openModal('item');
}

// ── PUSH NOTIFICATIONS ──────────────────────────────────────
async function togglePush() {
  if (pushEnabled) {
    pushEnabled = false;
    await localforage.setItem(storageKey('push'), false);
    toast('Notifikace vypnuty'); renderProfile(); return;
  }
  if (!('Notification' in window)) { toast('Prohlížeč nepodporuje notifikace'); return; }
  const p = await Notification.requestPermission();
  pushEnabled = (p === 'granted');
  await localforage.setItem(storageKey('push'), pushEnabled);
  if (pushEnabled) { toast('✓ Notifikace aktivní'); checkAndNotify(); }
  else toast('Notifikace zamítnuty');
  renderProfile();
}
function checkAndNotify() {
  if (!pushEnabled || Notification.permission !== 'granted') return;
  receipts.filter(r => { const d=wDaysLeft(r); return d!==null&&d>=0&&d<=30; })
    .forEach((r,i) => setTimeout(() => new Notification('⏰ Záruka brzy vyprší', {body: r.name + ' — ' + wDaysLeft(r) + ' dní'}), i*600));
}

// ── CALENDAR ───────────────────────────────────────────────
function renderCalendar() {
  const el = document.getElementById('calendarContent'); if (!el) return;
  const today = new Date();
  const firstDay = new Date(calYear, calMonth, 1);
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  let startDow = firstDay.getDay();
  startDow = startDow === 0 ? 6 : startDow - 1;

  const events = {};
  const addEv = (ds, ev) => { if (!events[ds]) events[ds]=[]; events[ds].push(ev); };
  receipts.forEach(r => {
    if (r.purchaseDate) addEv(r.purchaseDate, {type:'receipt',label:r.name,color:'#6c5ce7',id:r.id});
    const exp = wExpiry(r);
    if (exp) {
      const ds = exp.toISOString().split('T')[0];
      const d  = wDaysLeft(r);
      addEv(ds, {type:'warranty',label:'🛡 '+r.name,color:d<0?'#ff6b6b':d<=30?'#feca57':'#1dd1a1',id:r.id});
    }
  });

  let grid = '<div class="cal-grid">';
  DAYS.forEach(d => { grid += '<div class="cal-dow">' + d + '</div>'; });
  for (let i=0; i<startDow; i++) grid += '<div class="cal-empty"></div>';
  for (let day=1; day<=daysInMonth; day++) {
    const mm = String(calMonth+1).padStart(2,'0'), dd = String(day).padStart(2,'0');
    const ds = calYear+'-'+mm+'-'+dd;
    const isToday = today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===day;
    const evs = events[ds] || [];
    const dots = evs.map(e => '<div class="cal-dot" style="background:'+e.color+'"></div>').join('');
    const hasWarn = evs.some(e => e.type==='warranty'&&e.color==='#feca57');
    const hasExp  = evs.some(e => e.type==='warranty'&&e.color==='#ff6b6b');
    const cls = hasExp ? 'cal-cell cal-cell-exp' : hasWarn ? 'cal-cell cal-cell-warn' : 'cal-cell';
    grid += '<div class="' + cls + '" onclick="calDayClick(\'' + ds + '\')">' +
      '<div class="cal-num' + (isToday?' cal-today':'') + '">' + day + '</div>' +
      '<div class="cal-dots">' + dots + '</div>' +
    '</div>';
  }
  grid += '</div>';

  const ms = calYear+'-'+String(calMonth+1).padStart(2,'0');
  const mevs = [];
  Object.entries(events).forEach(([ds,evs]) => { if (ds.startsWith(ms)) evs.forEach(e => mevs.push(Object.assign({ds},e))); });
  mevs.sort((a,b) => a.ds.localeCompare(b.ds));

  let evList = '';
  if (mevs.length) {
    evList = '<div class="cal-ev-list">';
    let lastDs = '';
    mevs.forEach(e => {
      if (e.ds !== lastDs) {
        const p = e.ds.split('-');
        evList += '<div class="cal-ev-date">' + parseInt(p[2]) + '. ' + MONTHS[parseInt(p[1])-1] + '</div>';
        lastDs = e.ds;
      }
      evList += '<div class="cal-ev-item" onclick="showReceiptDetail(\'' + e.id + '\')">' +
        '<div class="cal-ev-dot" style="background:'+e.color+'"></div>' +
        '<div><div class="cal-ev-name">'+e.label+'</div><div class="cal-ev-type">'+(e.type==='warranty'?'Záruka':'Nákup')+'</div></div>' +
      '</div>';
    });
    evList += '</div>';
  } else {
    evList = '<div class="empty">Žádné události tento měsíc</div>';
  }

  el.innerHTML =
    '<div class="cal-header">' +
      '<button class="cal-nav" onclick="calPrev()">&#8249;</button>' +
      '<div class="cal-title">' + MONTHS[calMonth] + ' ' + calYear + '</div>' +
      '<button class="cal-nav" onclick="calNext()">&#8250;</button>' +
    '</div>' +
    '<div class="cal-legend">' +
      '<span class="cal-leg"><span class="cal-leg-dot" style="background:#6c5ce7"></span>Nákup</span>' +
      '<span class="cal-leg"><span class="cal-leg-dot" style="background:#1dd1a1"></span>Záruka OK</span>' +
      '<span class="cal-leg"><span class="cal-leg-dot" style="background:#feca57"></span>Vyprší brzy</span>' +
      '<span class="cal-leg"><span class="cal-leg-dot" style="background:#ff6b6b"></span>Vypršela</span>' +
    '</div>' +
    grid +
    '<div style="margin-top:20px;font-size:11px;font-weight:700;color:var(--t-muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px">Události v měsíci</div>' +
    evList;
}
function calPrev() { if (calMonth===0){calMonth=11;calYear--;} else calMonth--; renderCalendar(); }
function calNext() { if (calMonth===11){calMonth=0;calYear++;} else calMonth++; renderCalendar(); }
function calDayClick(ds) {
  const r = receipts.find(r => r.purchaseDate===ds) || receipts.find(r => { const exp=wExpiry(r); return exp&&exp.toISOString().split('T')[0]===ds; });
  if (r) showReceiptDetail(r.id);
}

// ── PROFILE ─────────────────────────────────────────────────
function renderProfile() {
  if (!user) return;
  const initials = user.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const greens   = items.filter(i=>i.light==='green').length;
  const expiring = receipts.filter(r=>{const d=wDaysLeft(r);return d!==null&&d>=0&&d<=30;}).length;
  document.getElementById('profileContent').innerHTML =
    '<div style="text-align:center;margin-bottom:24px">' +
      '<div class="profile-avatar">' + initials + '</div>' +
      '<div style="font-size:20px;font-weight:700">' + user.name + '</div>' +
      '<div style="font-size:14px;color:var(--t-muted)">' + user.email + '</div>' +
    '</div>' +
    '<div class="stat-row">' +
      '<div class="stat-card"><div class="stat-num">' + receipts.length + '</div><div class="stat-label">Účtenek</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + items.length    + '</div><div class="stat-label">Položek</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--s-green)">' + greens   + '</div><div class="stat-label">Super produktů</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:' + (expiring?'var(--s-amber)':'var(--a-violet)') + '">' + expiring + '</div><div class="stat-label">Záruky brzy</div></div>' +
    '</div>' +
    '<div style="font-size:11px;color:var(--t-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px">🔔 Notifikace</div>' +
    '<button class="pcard" onclick="togglePush()">' +
      '<div style="display:flex;align-items:center;gap:12px;flex:1">' +
        '<div class="push-dot ' + (pushEnabled?'on':'off') + '"></div>' +
        '<div><strong>Push notifikace</strong><span>' + (pushEnabled?'Aktivní':'Klikni pro aktivaci') + '</span></div>' +
        '<div style="margin-left:auto;font-size:13px;font-weight:600;color:' + (pushEnabled?'var(--s-green)':'var(--t-muted)') + '">' + (pushEnabled?'ZAP':'VYP') + '</div>' +
      '</div>' +
    '</button>' +
    '<div style="font-size:11px;color:var(--t-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.6px;margin:18px 0 10px">☁️ Záloha</div>' +
    '<button class="pcard" onclick="exportData()"><div class="pcard-icon" style="background:rgba(74,222,128,0.1)">📤</div><div><strong>Export dat (JSON)</strong><span>Stáhnout zálohu</span></div></button>' +
    '<label class="pcard" style="cursor:pointer"><div class="pcard-icon" style="background:rgba(167,139,250,0.1)">📥</div><div><strong>Import dat</strong><span>Obnovit ze zálohy</span></div><input type="file" accept=".json" style="display:none" onchange="importData(this)" /></label>' +
    '<div style="margin-top:20px"><button class="btn btn-danger" style="width:100%" onclick="logout()">Odhlásit se</button></div>' +
    '<div style="text-align:center;margin-top:20px;font-size:12px;color:var(--t-muted)">Paměť v3.0 · Data uložena v tomto prohlížeči</div>';
}

function exportData() {
  const data = {version:3, exportedAt:new Date().toISOString(), user:{name:user.name,email:user.email}, receipts, items};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a'); a.href=url; a.download='pamet-export-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  URL.revokeObjectURL(url); toast('Export stažen!');
}
async function importData(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const data = JSON.parse(e.target.result);
      const nr = (data.receipts||[]).filter(r => !receipts.find(x=>x.id===r.id));
      const ni = (data.items||[]).filter(i => !items.find(x=>x.id===i.id));
      receipts = [...nr,...receipts]; items = [...ni,...items];
      await saveReceipts(); await saveItems();
      renderReceipts(); renderItems(); renderZaruky(); renderProfile(); checkExpiryBanner();
      toast('Import: +'+nr.length+' účtenek, +'+ni.length+' položek');
    } catch(e) { toast('Chyba: neplatný soubor'); }
  };
  reader.readAsText(file);
}

// ── INIT ────────────────────────────────────────────────────
(async function init() {
  try {
    const saved = await localforage.getItem('user');
    if (saved && saved.email) {
      user = saved;
      await bootApp();
    }
  } catch(e) {
    console.warn('Init error:', e);
  }
})();
</script>
</body>
